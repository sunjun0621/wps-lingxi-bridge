<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>灵犀 Bridge</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--panel:#f3f5f4;--row:#f6f7f7;--text:#202826;--muted:#78817e;--line:#e0e7e3;--green:#266e5c;--green-bg:#e8f1ed;--orange:#bc752c;--red:#b0413a}
*{box-sizing:border-box}body{margin:0;display:flex;height:100vh;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden}
aside{width:264px;flex-shrink:0;padding:26px 20px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:14px}
h1{font-size:19px;margin:0 0 4px;letter-spacing:-.5px}.tagline{font-size:11.5px;line-height:1.7;color:var(--muted);margin:0 0 20px}
.acct-title{font-size:12px;color:var(--muted);margin:0 0 9px;letter-spacing:.5px}
.account-card{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:13px;display:flex;flex-direction:column;gap:10px}
.acct-top{display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--green-bg);object-fit:cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--green);font-size:18px}
.acct-meta{min-width:0}.acct-name{font-size:14px;font-weight:600;line-height:1.3;word-break:break-all}.acct-uid{font-size:11px;color:var(--muted);margin-top:2px}
.acct-state{display:flex;align-items:center;gap:7px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0}.dot.off{background:var(--orange)}
.qr-toggle{width:100%;font:inherit;border:1px solid var(--green);color:var(--green);background:transparent;border-radius:8px;padding:8px;cursor:pointer}
.qr-toggle:hover{background:var(--green-bg)}
.qr-box{margin-top:11px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:13px;display:flex;flex-direction:column;align-items:center;gap:9px}
.qr-img{width:196px;height:196px;border-radius:6px;display:block}
.qr-status{font-size:12px;color:var(--green);text-align:center;line-height:1.6;min-height:32px}
.qr-status.wait{color:var(--muted)}.qr-status.err{color:var(--orange)}
.qr-refresh{font:inherit;border:none;background:none;color:var(--green);cursor:pointer;font-size:12px;padding:2px}
.sidebar-bottom{margin-top:auto}.creator{font-size:11px;color:var(--muted);line-height:1.8;margin:20px 0 0;user-select:text}
main{padding:26px 30px;flex:1;min-width:0;display:flex;flex-direction:column;gap:15px;overflow:hidden}
header{display:flex;justify-content:space-between;gap:12px;align-items:center}h2{font-size:23px;letter-spacing:-.8px;margin:0 0 6px;font-weight:650}
.subtitle{margin:0;color:var(--muted);font-size:12.5px}.actions{display:flex;gap:8px}
button{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 11px;cursor:pointer;white-space:nowrap;transition:background .15s}
button:hover:not(:disabled){background:var(--green-bg)}button:disabled{opacity:.48;cursor:default}
.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover:not(:disabled){background:#1b594a}
.service-status{padding:10px 13px;border-radius:8px;background:var(--green-bg);display:flex;align-items:center;gap:9px;min-height:38px;font-size:12.5px;flex-wrap:wrap}
.lingxi-state{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--muted)}
.lingxi-state.dead{color:#fff;background:var(--red)}
.lingxi-state.running{color:var(--green)}
#activityBox{background:var(--row);border-radius:9px;padding:11px 13px;display:flex;flex-direction:column;gap:6px;flex-shrink:0;max-height:170px;overflow:auto}
#activityBox h3{margin:0;font-size:12.5px;display:flex;justify-content:space-between;align-items:center}
#activityBox h3 .openlogs{font:inherit;font-size:11.5px;padding:3px 9px}
.act-row{display:flex;gap:9px;align-items:center;font-size:12px;color:var(--text);font-variant-numeric:tabular-nums}
.act-row .m{font-weight:550;min-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-row .st{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--bg);color:var(--muted);white-space:nowrap}
.act-row .st.upstream{color:var(--orange);background:rgba(188,117,44,.12)}
.act-row .st.content{color:var(--green)}
.act-row .st.failed{color:#fff;background:var(--red)}
.act-row .st.done{color:var(--green);background:var(--green-bg)}
.act-row .t{color:var(--muted);font-size:11px;margin-left:auto;white-space:nowrap}
.act-empty{font-size:12px;color:var(--muted)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.metrics{display:flex;gap:26px}.metrics div{display:flex;flex-direction:column;gap:3px}
.metrics b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}.metrics span{font-size:11px;color:var(--muted)}
.tool-actions{display:flex;align-items:center;gap:9px}
#testEffort{font:inherit;font-size:12px;padding:7px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text)}
.switch{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer}
#models{overflow:auto;flex:1;min-height:80px;display:flex;flex-direction:column;gap:7px;padding:2px}
.model{display:flex;align-items:center;gap:12px;padding:10px 13px;border:1px solid transparent;background:var(--row);border-radius:9px;width:100%}
.model.selected{background:var(--green-bg);border-color:var(--green)}
.model-check{width:17px;height:17px;flex-shrink:0;accent-color:var(--green);cursor:pointer}
.model-info{min-width:1;width:150px;flex-shrink:0}.model-name{font-size:13.5px;font-weight:550;line-height:1.4}.model-key{font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.effort-cell{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.segbtn{border:none;border-radius:0;padding:5px 11px;font-size:12px;background:var(--bg)}
.segbtn.on{background:var(--green);color:#fff}
.adaptive{font-size:11.5px;color:var(--muted)}
.badges{display:flex;align-items:center;gap:8px;flex-shrink:0;min-width:150px;justify-content:flex-end}
.badge{font-size:11px;white-space:nowrap;padding:4px 8px;border-radius:6px;background:var(--green-bg);color:var(--green)}
.badge.ok{background:var(--green);color:#fff}.badge.bad{color:#fff;background:var(--red)}.badge.time{background:transparent;color:var(--muted);padding:4px 0}
#feedback{font-size:12.5px;background:var(--green-bg);color:var(--green);padding:10px 13px;border-radius:8px}#feedback.error{color:var(--orange);background:#fbefdf}
#testbox{padding:11px 13px;background:var(--row);border-radius:9px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.testrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#testModel,#singleEffort{font:inherit;padding:7px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text);font-size:12.5px}
#testPrompt{flex:1;min-width:160px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text)}
#testResult{max-height:96px;overflow:auto;font-size:12px;line-height:1.7;white-space:pre-wrap;user-select:text}
footer{font-size:11px;color:var(--muted);line-height:1.6;flex-shrink:0}
[hidden]{display:none!important}
@media(prefers-color-scheme:dark){:root{--bg:#202422;--panel:#272d2a;--row:#2a302d;--text:#e3ebe6;--muted:#a0ada5;--line:#3b4540;--green:#8cc9ad;--green-bg:#2a4035;--orange:#e9ad70}.primary,.segbtn.on{color:#17221c}.badge.bad{background:#7a3530;color:#f3d9d6}#feedback.error{background:#45392c}}
</style></head>
<body>
<aside>
  <div class="brand-mark">灵</div><h1>灵犀 Bridge</h1>
  <p class="tagline">把 WPS 灵犀订阅模型<br>接入 WorkBuddy / dsh</p>

  <p class="acct-title">灵犀账号</p>
  <div class="account-card">
    <div class="acct-top">
      <div class="avatar" id="av">?</div>
      <div class="acct-meta"><div class="acct-name" id="acctName">未登录</div>
        <div class="acct-uid" id="acctUid">点击下方按钮扫码</div></div>
    </div>
    <div class="acct-state"><span id="acct-dot" class="dot off"></span><span id="acctState">检测中…</span></div>
    <button class="qr-toggle" id="qrToggle">扫码登录 / 切换账号</button>
  </div>

  <div class="qr-box" id="qrBox" hidden>
    <img class="qr-img" id="qrImg" alt="登录二维码">
    <div class="qr-status wait" id="qrStatus">正在获取二维码…</div>
    <button class="qr-refresh" id="qrRefresh">刷新二维码</button>
  </div>

  <div class="sidebar-bottom"><p class="creator">仅用于个人学习，调用本人订阅额度<br>请勿公开、转售或共享令牌</p></div>
</aside>
<main>
  <header><div><h2>灵犀订阅模型</h2><p class="subtitle">勾选模型并选择思维等级；可一键测试后导入 WorkBuddy。</p></div>
  <div class="actions"><button id="findcfg">读取 WorkBuddy 配置</button></div></header>
  <div class="service-status"><span id="service-dot" class="dot off"></span><span id="service-text">正在检测服务…</span>
    <span class="lingxi-state" id="lingxi-state" hidden></span>
    <span class="lingxi-state" id="meta-info" hidden></span></div>
  <div id="activityBox" hidden>
    <h3><span id="actTitle">活动</span>
      <span style="display:flex;gap:6px">
        <button class="openlogs" id="actToggle" title="切换 实时/历史（历史来自 reqlog.jsonl，跨重启保留）">历史</button>
        <button class="openlogs" id="openLogs">打开日志目录</button>
      </span></h3>
    <div id="actList"><div class="act-empty">暂无请求记录。从 WorkBuddy 发起对话后，这里会实时显示进行中与最近 20 条请求。</div></div>
  </div>
  <section class="toolbar">
    <div class="metrics"><div><b id="discovered">0</b><span>已发现</span></div><div><b id="selected">0</b><span>已勾选</span></div><div><b id="imported">0</b><span>已导入</span></div></div>
    <div class="tool-actions">
      <select id="testEffort" title="一键测试统一等级（留空用各模型已选等级）">
        <option value="">测试等级：各模型</option>
        <option value="low">统一：低</option>
        <option value="high">统一：高</option>
        <option value="max">统一：Max</option>
      </select>
      <button id="testAll">一键测试已勾选</button>
      <label class="switch"><input id="force" type="checkbox" style="accent-color:var(--green)">强制覆盖同名</label>
      <button id="import" class="primary">导入 WorkBuddy</button>
      <button id="importZcode" title="把勾选模型写入 ZCode 自定义供应商（~/.zcode/v2/provider_config.json），需重启 ZCode 生效">导入 ZCode</button>
    </div>
  </section>
  <div id="feedback" hidden></div>
  <section id="models" aria-label="模型列表"></section>
  <div id="testbox">
    <div class="testrow"><b style="font-size:12.5px">单个对话</b>
      <select id="testModel"></select>
      <select id="singleEffort"><option value="">默认等级</option><option value="low">低</option><option value="high">高</option><option value="max">Max</option></select>
      <input id="testPrompt" value="用一句话介绍你自己。">
      <button id="runTest">发送</button></div>
    <div id="testResult">结果将显示在这里。</div>
  </div>
  <footer><p id="sync">配置路径：检测中…</p></footer>
</main>
<script>
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const H = {Authorization: "Bearer " + TOKEN};
const $ = id => document.getElementById(id);
const EFF_LABEL = {low:"低", high:"高", max:"Max"};
function feedback(msg, isErr){ const f=$("feedback"); f.hidden=false; f.textContent=msg; f.className=isErr?"error":""; if(!isErr) setTimeout(()=>f.hidden=true,4000); }
async function api(path, opt){ opt=opt||{}; opt.headers=Object.assign({},H,opt.headers); const r=await fetch(path,opt); if(!r.ok){let t;try{t=(await r.json()).detail}catch(t){t=r.status};throw new Error(t);} return r.json(); }

/* ---------- 模型列表 ---------- */
async function loadModels(){
  const d = await api("/v1/models");
  const box=$("models"), sel=$("testModel"); box.innerHTML=""; sel.innerHTML="";
  d.data.forEach(m=>{
    if(m.id==="auto") return;
    const efs=m.reasoning_efforts||[];
    let effortHtml;
    if(efs.length){
      effortHtml = `<div class="seg">` + efs.map(e=>`<button class="segbtn" data-k="${m.id}" data-e="${e}">${EFF_LABEL[e]}</button>`).join("") + `</div>`;
    } else {
      effortHtml = `<span class="adaptive">自适应思考</span>`;
    }
    const lab=document.createElement("div"); lab.className="model selected";
    lab.innerHTML=`<input class="model-check" type="checkbox" data-k="${m.id}" checked>
      <div class="model-info"><div class="model-name">${m.name}</div><div class="model-key">${m.id}</div></div>
      <div class="effort-cell">${effortHtml}</div>
      <div class="badges"><span class="badge time" id="t-${m.id}"></span><span class="badge" id="b-${m.id}">待测试</span></div>`;
    box.appendChild(lab);
    const o=document.createElement("option"); o.value=m.id; o.textContent=m.name; sel.appendChild(o);
  });
  $("discovered").textContent=d.data.filter(x=>x.id!=="auto").length;
  box.querySelectorAll(".model-check").forEach(c=>c.onchange=()=>{c.closest(".model").classList.toggle("selected",c.checked);recount();});
  box.querySelectorAll(".segbtn").forEach(b=>b.onclick=()=>{
    const on=b.classList.contains("on");
    b.parentElement.querySelectorAll(".segbtn").forEach(x=>x.classList.remove("on"));
    if(!on) b.classList.add("on");
  });
  recount();
}
function selectedKeys(){ return [...document.querySelectorAll(".model-check")].filter(c=>c.checked).map(c=>c.dataset.k); }
function effortOf(k){ const s=document.querySelector(`.segbtn[data-k="${k}"].on`); return s?s.dataset.e:null; }
function recount(){ $("selected").textContent=selectedKeys().length; }

/* ---------- 账号 / 扫码 ---------- */
let qrAutoShown=false;   // 登录失效时自动展开扫码框（每页只自动展开一次，成功后复位）
async function refreshAccount(){
  try{
    const d=await api("/admin/account");
    const a=d.account;
    if(a){
      $("acctName").textContent=a.nickname||"已登录";
      $("acctUid").textContent="UID "+(a.user_id||"")+(a.phone?(" · "+a.phone):"");
      $("acct-dot").className="dot"; $("acctState").textContent="已登录"+(a.is_plus?"（会员）":"");
      $("av").innerHTML=""; const im=document.createElement("img"); im.className="avatar"; im.src=a.avatar; im.referrerPolicy="no-referrer";
      if(a.avatar){ $("av").appendChild(im); } else { $("av").textContent=(a.nickname||"灵").slice(0,1); }
      qrAutoShown=false;
    }else{
      $("acctName").textContent="未登录"; $("acctUid").textContent="请扫码登录";
      $("acct-dot").className="dot off"; $("acctState").textContent="登录态失效";
      $("av").textContent="?";
      if(!qrAutoShown){   // 失效即自动展开二维码：用 WPS 手机 APP 扫一下即可，无需任何客户端
        qrAutoShown=true; startQr();
        feedback("登录已失效，已自动展开二维码：用 WPS 手机 APP 扫码即可恢复",true);
      }
    }
  }catch(e){ $("acctState").textContent="检测失败："+e.message; }
}
let qrPhase="scan", qrAlive=false, qrStartedAt=0;
function setQrStatus(t,cls){ const e=$("qrStatus"); e.textContent=t; e.className="qr-status "+(cls||"wait"); }
async function startQr(){
  $("qrBox").hidden=false; qrAlive=true; qrStartedAt=Date.now(); setQrStatus("正在获取二维码…","wait");
  try{
    const d=await api("/admin/qr/start",{method:"POST"});
    $("qrImg").src=d.qr_url; qrPhase="scan";
    setQrStatus("请使用 WPS APP 扫码登录","wait");
    pollQr();
  }catch(e){ setQrStatus(e.message,"err"); }
}
async function pollQr(){
  if(!qrAlive) return;
  try{
    const o=await api("/admin/qr/poll?phase="+qrPhase);
    if(!qrAlive) return;
    if(o.state==="pending"){
      if(qrPhase==="scan" && Date.now()-qrStartedAt>140000){
        setQrStatus("二维码可能已过期：若手机扫不到，请点「刷新二维码」","err");
      }
      pollQr();
    }
    else if(o.state==="scan"){
      setQrStatus("已扫码"+(o.nickname?("（"+o.nickname+"）"):"")+"，请在手机上确认","");
      qrPhase="confirm"; pollQr();
    }
    else if(o.state==="logined"){
      setQrStatus("登录成功，正在切换…",""); qrAlive=false; qrAutoShown=false;
      await refreshAccount(); feedback("账号已切换并重新连接");
      setTimeout(()=>{ $("qrBox").hidden=true; },1500);
    }
    else if(o.state==="grant_failed"){ setQrStatus("登录失败："+JSON.stringify(o.detail),"err"); qrAlive=false; }
    else { pollQr(); }
  }catch(e){ setQrStatus(e.message+"，2 秒后重试","err"); setTimeout(pollQr,2000); }
}
$("qrToggle").onclick=startQr;
$("qrRefresh").onclick=startQr;

/* ---------- 一键测试 ---------- */
let testPollTimer=null;
function probeTitle(it){   // 探测指标悬停详情：首字/字数/速率
  const bits=[];
  if(it.ttfb!=null) bits.push("首字 "+it.ttfb+"s");
  if(it.chars) bits.push("输出 "+it.chars+" 字");
  if(it.rate!=null) bits.push("约 "+it.rate+" 字/秒");
  return bits.join(" · ");
}
$("testAll").onclick=async()=>{
  const keys=selectedKeys();
  if(!keys.length) return feedback("请先勾选模型",true);
  const effort_map={}; keys.forEach(k=>{ const e=effortOf(k); if(e) effort_map[k]=e; });
  try{
    await api("/admin/test-all",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({models:keys,effort:$("testEffort").value,effort_map})});
    keys.forEach(k=>{ const b=$("b-"+k); b.className="badge"; b.textContent="排队中"; $("t-"+k).textContent=""; $("t-"+k).title=""; });
    feedback("开始测试 "+keys.length+" 个模型…");
    if(testPollTimer) clearInterval(testPollTimer);
    testPollTimer=setInterval(pollTestProgress,1200); pollTestProgress();
  }catch(e){ feedback(e.message,true); }
};
async function pollTestProgress(){
  try{
    const d=await api("/admin/test-progress");
    d.done.forEach(it=>{
      const b=$("b-"+it.model), tm=$("t-"+it.model);
      tm.textContent=it.elapsed+"s";
      if(it.ok){
        b.className="badge ok"; b.textContent="可用";
        tm.textContent=it.elapsed+"s"+(it.chars?(" · "+it.chars+"字"):"");
        tm.title=probeTitle(it); b.title=probeTitle(it);
      }
      else { b.className="badge bad"; b.textContent="失败"; b.title=(it.hint?it.hint+"\n":"")+(it.error||""); }
    });
    if(!d.running){
      clearInterval(testPollTimer);
      const ok=d.done.filter(x=>x.ok).length;
      feedback(`测试完成：${ok}/${d.total} 可用（结果已保存，刷新页面不丢失）`, ok<d.total);
    }
  }catch(e){ clearInterval(testPollTimer); feedback(e.message,true); }
}

/* ---------- WorkBuddy ---------- */
const LINGXI_LABEL = {idle:"灵犀：待启动", running:"灵犀：已连接", dead:"灵犀：已断开（自动恢复中）"};
function applyBadges(results){
  if(!results) return;
  Object.entries(results).forEach(([k,r])=>{
    const b=$("b-"+k), tm=$("t-"+k);
    if(!b) return;
    if(r.ok){
      b.className="badge ok"; b.textContent="可用";
      if(tm){
        tm.textContent=r.elapsed+"s"+(r.chars?(" · "+r.chars+"字"):"");
        tm.title=probeTitle(r); b.title=probeTitle(r);
      }
    }
    else { b.className="badge bad"; b.textContent="失败"; b.title=(r.hint||"")+(r.error||""); }
  });
}
async function refreshStatus(){
  try{
    const s=await api("/admin/status");
    $("service-dot").className="dot"; $("service-text").textContent="服务运行中 · "+s.service;
    const ls=$("lingxi-state"); ls.hidden=false; ls.textContent=LINGXI_LABEL[s.lingxi?.state]||s.lingxi?.state||"";
    ls.className="lingxi-state "+(s.lingxi?.state==="dead"?"dead":s.lingxi?.state==="running"?"running":"");
    const mi=$("meta-info"); mi.hidden=false;
    mi.textContent=`${s.host}:${s.port} · 令牌 ${s.token_mask} · 超时 ${s.timeout}s · 已运行 ${s.uptime}`;
    mi.title=s.gateway_config
      ? `配置文件：${s.gateway_config.path}${s.gateway_config.exists?"（生效）":"（未创建，用默认值）"}`
      : "";
    $("sync").textContent="配置路径："+s.config.path+(s.config.exists?"（已存在）":"（将在导入时创建）");
    $("imported").textContent=s.config.imported.length;
  }catch(e){ $("service-dot").className="dot off"; $("service-text").textContent="服务异常："+e.message; }
}
/* ---------- 活动面板（实时 2s 轮询 / 历史来自 reqlog.jsonl） ---------- */
let actMode="live";   // live=内存活动, history=reqlog 持久记录
function actRow(it){
  const live=!it.ts;   // 实时记录无 ts,历史记录(要求log)有 ts
  const ttfb=live?it.first_byte:it.ttfb;
  const stage=it.stage||"";
  const label=live?(it.stage_label||stage)
    :(stage==="done"?"完成":stage==="failed"?"失败":stage);
  const dur=it.elapsed!=null?Number(it.elapsed).toFixed(1)+"s"
    :(ttfb!=null?`首字 ${ttfb}s`:Math.round(Date.now()/1000-it.start)+"s…");
  const chars=(it.chars||0)?` · ${it.chars}字`:"";
  const err=it.error?` title="${String(it.error).replace(/"/g,"&quot;")}"`:"";
  const ts=it.ts?`<span class="t" style="min-width:118px">${String(it.ts).slice(5)}</span>`:"";
  return `<div class="act-row"${err}>${ts}<span class="m">${it.model}</span>`
    +`<span class="st ${stage}">${label}</span>`
    +`<span class="t">${(ttfb!=null&&it.elapsed!=null)?`首字 ${ttfb}s · `:""}${dur}${chars}</span></div>`;
}
function renderActivity(d){
  const box=$("activityBox"), list=$("actList");
  box.hidden=false;
  $("actTitle").textContent=actMode==="live"
    ?(d.active?`活动（进行中 ${d.active}）`:"活动") : "活动 · 历史";
  if(!d.recent.length){ list.innerHTML='<div class="act-empty">暂无请求记录。从 WorkBuddy 发起对话后，这里会实时显示进行中与最近 20 条请求。</div>'; return; }
  list.innerHTML=d.recent.map(actRow).join("");
}
let actTimer=null;
async function pollActivity(){
  try{
    if(actMode==="live"){ renderActivity(await api("/admin/activity")); }
    else{
      const h=await api("/admin/reqlog?limit=50");
      renderActivity({active:0, recent:h.entries||[]});
    }
  }catch(e){ /* 服务异常时状态行已提示 */ }
}
$("actToggle").onclick=()=>{
  actMode=actMode==="live"?"history":"live";
  $("actToggle").textContent=actMode==="live"?"历史":"实时";
  pollActivity();
};
$("openLogs").onclick=async()=>{ try{ await api("/admin/open-logs",{method:"POST"}); }catch(e){ feedback(e.message,true); } };
$("findcfg").onclick=async()=>{ try{ await api("/admin/find-config",{method:"POST"}); feedback("已读取配置"); refreshStatus(); }catch(e){ feedback(e.message,true);} };
$("import").onclick=async()=>{
  const sel=selectedKeys(); if(!sel.length) return feedback("请至少勾选一个模型",true);
  $("import").disabled=true;
  try{ const r=await api("/admin/import",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({selected:sel,force:$("force").checked})});
    feedback(`已导入 ${r.count} 个模型到 ${r.path}`+(r.backup?"（已备份）":"")); refreshStatus();
  }catch(e){ feedback(e.message,true);} $("import").disabled=false;
};
$("importZcode").onclick=async()=>{
  const sel=selectedKeys(); if(!sel.length) return feedback("请至少勾选一个模型",true);
  $("importZcode").disabled=true;
  try{
    const st=await api("/admin/zcode-status");
    if(st.zcode_running && !confirm("检测到 ZCode 正在运行：写入后它的下一次保存可能覆盖本条目。\n建议完全退出 ZCode 再导入。仍要继续吗？")) { $("importZcode").disabled=false; return; }
    const r=await api("/admin/import-zcode",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({selected:sel})});
    feedback(r.hint+(r.backup?"（原配置已备份）":"（无改动）"));
  }catch(e){ feedback(e.message,true); } $("importZcode").disabled=false;
};

/* ---------- 单个对话 ---------- */
$("runTest").onclick=async()=>{
  const model=$("testModel").value, prompt=$("testPrompt").value, ef=$("singleEffort").value;
  $("testResult").textContent="请求中…";
  try{
    const body={model,messages:[{role:"user",content:prompt}],stream:false};
    if(ef) body.reasoning_effort=ef;
    const r=await fetch("/v1/chat/completions",{method:"POST",headers:Object.assign({},H,{"Content-Type":"application/json"}),body:JSON.stringify(body)});
    const o=await r.json(); if(!r.ok) throw new Error(o.detail);
    $("testResult").textContent=o.choices[0].message.content;
    const b=$("b-"+model); b.className="badge ok"; b.textContent="可用";
  }catch(e){
    $("testResult").textContent="错误："+e.message;
    const b=$("b-"+model); b.className="badge bad"; b.textContent="失败";
    // 鉴权类错误：自动展开二维码，点一下扫码即可恢复（无需客户端）
    if(/登录|扫码|sid|失效/i.test(e.message) && (qrAlive===false || qrBox.hidden)){
      $("qrBox").hidden=false; startQr();
      feedback("登录已失效，已为你打开扫码框：用 WPS 手机 APP 扫码即恢复",true);
    }
  }
};
$("testModel").onchange=()=>{ /* 切换时同步等级可选项，简化处理 */ };

(async()=>{
  try{
    await loadModels();
    try{ applyBadges((await api("/admin/results")).results); }catch(e){}   // 恢复历史测试徽标
    await Promise.all([refreshStatus(),refreshAccount()]);
    pollActivity(); actTimer=setInterval(pollActivity,2000);
  }catch(e){ $("service-text").textContent=e.message; }
})();
setInterval(refreshStatus,20000);
setInterval(refreshAccount,60000);
</script>
